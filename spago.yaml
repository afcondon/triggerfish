package:
  name: triggerfish
  description: >
    Triggerfish — direct-manipulation UIs for the BEAM-native sequencers and
    Selene polysignals (the graphical sibling of Calypso #192). Odonus grid
    first: copy the René/Cartesian baseline, then the Fugue-Machine multi-
    playhead juice.
  dependencies:
    - prelude
    - harmonia
    - rebus
    - reef
    - effect
    - aff
    - arrays
    - maybe
    - integers
    - foldable-traversable
    - tailrec
    - halogen
    - halogen-subscriptions
    - web-html
    - web-events
    - web-uievents
    - console
    - js-timers
    - random
    - binnacle
    # vendored purerl-tidal mini-notation engine (src/Tidal/**)
    - control
    - either
    - newtype
    - numbers
    - ordered-collections
    - parsing
    - rationals
    - strings
    - transformers
    - tuples
    # vendored Vetula harmonic surface (src/Vetula/**) — the 4th instrument
    - nullable
    - colors
    - lists
    - foreign         # reef's Reef.Protocol/Reef.Scale (transitive via reef)
    - foreign-object
    - simple-json     # reef's wire codec (Reef.Protocol.encodeOdonus)
    - web-dom
    - halogen-svg-elems
    - halogen-widgets
    - hylograph-simulation
    - hylograph-simulation-halogen
    - hylograph-selection
    - hylograph-d3-kernel
  bundle:
    module: Triggerfish.Main
    outfile: public/bundle.js
    platform: browser
  test:
    main: Triggerfish.Harness
    dependencies: []
workspace:
  extraPackages:
    # The theory layer. PATH-DEP during development of the Progressions-family
    # generator (Palette / Freedom / Walk / OpenVoicing / Progression, added
    # 2026-09-14) — those modules are not in the published 0.2.0. Back to
    # `harmonia: 0.3.0` once it is cut, the same way reef will go.
    harmonia:
      path: ../../harmonia
    # Portable virtual-module engines (Phase 1: Odonus). Path-dep during dev;
    # git-tag once reef is published, like harmonia.
    reef:
      path: ../../reef
    # The glyph substrate, extracted 2026-09-13 so Quadrat can mint the SAME
    # identities from the same content. Path-dep during dev; it is deliberately
    # tiny and registry-shaped, so it can be published the moment a second repo
    # actually depends on it.
    rebus:
      path: ../../../code-typography/rebus
    binnacle:
      path: ../binnacle
    # Shared widget library (Vetula's Select/Modal + the Selene routing
    # cascade menu). Now the registry release `halogen-widgets` (namespace
    # Halogen.Widgets.*), migrated 2026-07-31 off the old path-dep
    # hylograph-halogen-ui v0.1 (Hylograph.Halogen.UI.*).
    # TEMPORARY local override while the Svg/Euclid coalescence is tested.
    # Back this out to `halogen-widgets: 0.4.0` before committing.
    halogen-widgets:
      path: ../../../purescript-halogen-widgets
  packageSet:
    registry: 77.13.1
