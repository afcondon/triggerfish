package:
  name: triggerfish
  description: >
    Triggerfish — direct-manipulation UIs for the BEAM-native sequencers and
    Selene polysignals (the graphical sibling of Calypso #192). Odonus grid
    first: copy the René/Cartesian baseline, then the Fugue-Machine multi-
    playhead juice.
  dependencies:
    - prelude
    - harmonia
    - reef
    - effect
    - aff
    - arrays
    - maybe
    - integers
    - foldable-traversable
    - tailrec
    - halogen
    - halogen-subscriptions
    - web-html
    - web-events
    - web-uievents
    - console
    - js-timers
    - binnacle
    # vendored purerl-tidal mini-notation engine (src/Tidal/**)
    - control
    - either
    - newtype
    - numbers
    - ordered-collections
    - parsing
    - rationals
    - strings
    - transformers
    - tuples
    # vendored Vetula harmonic surface (src/Vetula/**) — the 4th instrument
    - nullable
    - colors
    - lists
    - foreign         # reef's Reef.Protocol/Reef.Scale (transitive via reef)
    - foreign-object
    - simple-json     # reef's wire codec (Reef.Protocol.encodeOdonus)
    - web-dom
    - halogen-svg-elems
    - hylograph-halogen-ui
    - hylograph-simulation
    - hylograph-simulation-halogen
    - hylograph-selection
    - hylograph-d3-kernel
  bundle:
    module: Triggerfish.Main
    outfile: public/bundle.js
    platform: browser
  test:
    main: Triggerfish.Harness
    dependencies: []
workspace:
  extraPackages:
    # Published library, from the registry (clean 0.2.0 manifest; the old broken
    # 0.1.0 over-long-description entry is gone from the index).
    harmonia: 0.2.0
    # Portable virtual-module engines (Phase 1: Odonus). Path-dep during dev;
    # git-tag once reef is published, like harmonia.
    reef:
      path: ../../reef
    binnacle:
      path: ../binnacle
    # Vetula dogfoods the shared widget library, pinned via the same git
    # worktree it uses standalone (both repos sit at music/live-coding/<name>,
    # so the relative path is identical).
    hylograph-halogen-ui:
      path: ../../../purescript-hylograph-halogen-ui-v0.1
  packageSet:
    registry: 77.13.1
