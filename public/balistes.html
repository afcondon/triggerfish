<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balistes</title>
  <!-- Balistes on its own page (src/Triggerfish/Balistes/Main.purs). Served beside the other
       pages so they share one origin, and so one routing store. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- The widget library's stylesheet (a copy of
       purescript-halogen-widgets/css/halogen-widgets.css): the quiet controls.
       data-theme="light" on <html> keeps the
       library light, since this page is. -->
  <link rel="stylesheet" href="halogen-widgets.css">
  <style>
    html, body { margin: 0; background: #fafafa; }
    /* The height of the page's fixed bar, which Balistes' panel sits below (as on every machine page). */
    :root { --tf-bar: 44px; }
  </style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- Per-load cache-bust: static-httpd sends no Cache-Control. -->
  <script>document.write('<script src="balistes.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
