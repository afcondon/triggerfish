<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triggerfish</title>
  <!-- The Atlantis dashboard (src/Triggerfish/Dashboard.purs). Served on the one
       origin with every machine's page, so they share the routing store, the
       mode, and the tab bus. Plan: docs/kb/plans/dashboard.md. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@800&family=Cormorant:ital,wght@1,700&family=Big+Shoulders+Stencil+Display:wght@800&family=Michroma&family=Instrument+Serif:ital@1&family=Major+Mono+Display&display=swap">
  <!-- The widget library's stylesheet: the quiet controls and the ledger the
       routing table is drawn with. A copy of
       purescript-halogen-widgets/css/halogen-widgets.css; after changing the
       library, copy it again (cp ../../../purescript-halogen-widgets/css/halogen-widgets.css public/). -->
  <link rel="stylesheet" href="halogen-widgets.css">
  <style>
    :root {
      --ground: #f1f6f6; --plate: #ffffff; --ink: #0f2530; --muted: #54707a; --faint: #a9bcc1;
      --rule: #cddbde; --reef: #0e5a73; --live: #2e9e6a; --alarm: #b3261e;
      /* Destination families: the routing ledger's marks and key. */
      --f-midi: #13807b; --f-cv: #a8327a; --f-rample: #c05a12; --f-sample: #5a55b8; --f-continuo: #8a5a2b;
      --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --ground: #0a1a21; --plate: #10252e; --ink: #e2eef0; --muted: #8fa9b1; --faint: #4f6d77;
        --rule: #22404b; --reef: #6cc3dc; --live: #4cc38a; --alarm: #f2837a;
        --f-midi: #4cc5bd; --f-cv: #e87bbd; --f-rample: #f0955a; --f-sample: #a9a4f2; --f-continuo: #d2a06d;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ground: #0a1a21; --plate: #10252e; --ink: #e2eef0; --muted: #8fa9b1; --faint: #4f6d77;
      --rule: #22404b; --reef: #6cc3dc; --live: #4cc38a; --alarm: #f2837a;
      --f-midi: #4cc5bd; --f-cv: #e87bbd; --f-rample: #f0955a; --f-sample: #a9a4f2; --f-continuo: #d2a06d;
    }
    /* The library reads --hw-*; point them at this page's tokens, which carry
       their own dark values. The :not() matches the specificity of the
       library's own dark rule, so this, coming later, wins in both themes. */
    :root:not([data-theme="-"]) {
      --hw-ink: var(--ink); --hw-ink-soft: var(--muted); --hw-faint: var(--faint);
      --hw-line: var(--rule); --hw-accent: var(--reef); --hw-danger: var(--alarm);
      --hw-surface: var(--plate); --hw-mono: var(--mono); --hw-font: var(--display);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 var(--display); }

    .top { position: sticky; top: 0; z-index: 10; background: var(--plate); border-bottom: 1px solid var(--ink); }
    .top .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 20px; }
    .brand { font-weight: 780; font-variation-settings: "wdth" 72; font-size: 22px; letter-spacing: .01em; }
    a.brand { color: var(--ink); text-decoration: none; }
    a.brand:hover { color: var(--reef); }
    .seg { display: inline-flex; border: 1px solid var(--ink); }
    .seg button { font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; padding: 8px 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
    .seg button.on { background: var(--ink); color: var(--plate); }
    .tempo { font: 400 13px var(--mono); color: var(--muted); }
    .tempo { display: inline-flex; align-items: center; gap: 4px; }
    .tempo .num { color: var(--ink); font: 400 18px var(--mono); font-variant-numeric: tabular-nums; width: 3.4em; text-align: right; border: none; border-bottom: 1px solid var(--rule); background: transparent; padding: 0 2px; -moz-appearance: textfield; }
    .tempo .num::-webkit-inner-spin-button, .tempo .num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .tempo .num:focus { outline: none; border-bottom-color: var(--reef); }
    .tempo .step { font: 400 14px/1 var(--mono); width: 22px; height: 22px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; padding: 0; }
    .tempo .step:hover { border-color: var(--ink); }
    .spacer { flex: 1; }

    .btn { display: inline-block; font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid var(--ink); padding: 8px 12px; cursor: pointer; text-decoration: none; }
    .btn.on { background: var(--ink); color: var(--plate); }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn.panic { border-color: var(--alarm); color: var(--alarm); }
    .btn.panic:hover { background: var(--alarm); color: #fff; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--reef); outline-offset: 2px; }

    .lamp { display: inline-flex; align-items: center; gap: 6px; font: 400 11px var(--mono); color: var(--muted); }
    .lamp i { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
    .lamp.live i { background: var(--live); }
    .note { font-size: 12.5px; color: var(--muted); }

    .body { display: block; padding: 20px; }
    @media (max-width: 860px) { .body { padding: 16px; } }
    .machines { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; align-items: start; }

    /* The views, as tabs in the top bar: text, with the current one underlined. */
    .tabs { display: flex; gap: 18px; }
    .tab { font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 6px 0; border-bottom: 2px solid transparent; }
    .tab:hover { color: var(--ink); }
    .tab.on { color: var(--ink); border-bottom-color: var(--ink); }

    .card { background: var(--plate); border: 1px solid var(--rule); }
    .card.closed .nameplate { filter: saturate(.35); opacity: .8; }
    .nameplate { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; background: var(--field); color: var(--letter); text-decoration: none; }
    .roundel { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--roundel, #fff); }
    .roundel .ico { width: 30px; height: 18px; display: block; --fine: none; }
    .wordmark { line-height: 1; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px 4px; }
    .meta { padding: 4px 14px 10px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; font: 400 12px var(--mono); padding: 5px 8px; border: 1px dashed var(--rule); }
    .chip.edited::after { content: "●"; color: var(--reef); }
    .chip.empty { color: var(--muted); }

    /* Nameplates: each machine's colour and face. */
    .m-odonus { --field: #1f3f94; --letter: #f4f7ff; }
    .m-vetula { --field: #c9982c; --letter: #2a1f08; }
    .m-balistes { --field: #35604a; --letter: #eaf3e4; }
    .m-selene { --field: #4f3f7f; --letter: #efeaff; }
    .m-conspicillum { --field: #16161a; --letter: #e6c02e; --roundel: #f2f2ee; }
    .m-quadrat { --field: #f3e7dc; --letter: #b4461b; }
    .w-odonus { font: 800 24px "Syne", var(--display); letter-spacing: -.01em; }
    .w-vetula { font: italic 700 30px "Cormorant", Georgia, serif; }
    .w-balistes { font: 800 28px "Big Shoulders Stencil Display", var(--display); letter-spacing: .06em; text-transform: uppercase; }
    .w-selene { font: 400 15px "Michroma", var(--display); letter-spacing: .2em; text-transform: uppercase; }
    .w-conspicillum { font: italic 400 27px "Instrument Serif", Georgia, serif; }
    .w-quadrat { font: 400 20px "Major Mono Display", var(--mono); letter-spacing: .04em; }

    .routing { background: var(--plate); border: 1px solid var(--rule); padding: 16px 18px; min-width: 0; }
    .sectionhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); margin-bottom: 8px; }
    .sectionhead h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    /* A machine's nameplate heads its group in the routing ledger. Space, not
       a rule, separates the groups. */
    .routing .hw-quiet-key { margin-top: 14px; }
    /* The notes and drums matrices: a modal over the dashboard. */
    .matrix-open { display: flex; gap: 8px; align-items: baseline; margin-bottom: 14px; }
    .matrix-open button, .matrix-card button { font: 600 12px var(--display); color: var(--ink); background: var(--plate); border: 1px solid var(--rule); padding: 4px 10px; cursor: pointer; }
    .matrix-open button:hover, .matrix-card button:hover { border-color: var(--reef); }
    .matrix-modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; overflow: auto; }
    .matrix-backdrop { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 28%, transparent); }
    .matrix-card { position: relative; background: var(--plate); border: 1px solid var(--rule); padding: 14px 18px 18px; max-width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
    .matrix-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--ink); padding-bottom: 8px; margin-bottom: 6px; gap: 16px; }
    .matrix-switch { display: flex; gap: 0; }
    .matrix-fold { margin-left: auto; margin-right: 12px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
    .matrix-card table.m tr.folded th.row { white-space: normal; max-width: 220px; font-size: 12px; line-height: 1.25; padding-top: 4px; padding-bottom: 4px; }
    .matrix-card .matrix-tab { font: 700 12px var(--display); letter-spacing: .1em; text-transform: uppercase; border-radius: 0; }
    .matrix-card .matrix-tab + .matrix-tab { border-left: none; }
    .matrix-card .matrix-tab.on { background: var(--ink); color: var(--plate); border-color: var(--ink); }
    .matrix-card .matrix-close { font-size: 18px; line-height: 1; padding: 2px 9px; border: none; }
    .matrix-scroll { overflow-x: auto; }
    .matrix-card table.m { border-collapse: separate; border-spacing: 0; font: 13px var(--mono); }
    /* Column heads at 45°: each label starts over its column's centre and
       climbs to the right, a hairline under it leading back down to the column. */
    .matrix-scroll { padding-right: 150px; }
    .matrix-card table.m th.col { vertical-align: bottom; padding: 0; height: 128px; width: 44px; position: relative; }
    .matrix-card table.m th.col .lab { position: absolute; left: 22px; bottom: 9px; transform-origin: 0 100%; transform: rotate(-45deg); white-space: nowrap; text-align: left; padding: 0 6px 1px 2px; border-bottom: 1px solid var(--rule); }
    .matrix-card table.m th.col .lab b { font: 600 12.5px var(--display); color: var(--ink); }
    .matrix-card table.m th.col .lab small { font: 600 9.5px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: 6px; }
    .matrix-card table.m th.col.missing .lab b { color: var(--alarm); text-decoration: line-through; }
    .matrix-card table.m th.col.focus .lab b { color: var(--reef); }
    .matrix-card table.m th.col.focus .lab { border-bottom-color: var(--reef); }
    .matrix-card table.m th.col .fam { display: block; height: 3px; margin: 0 6px; }
    .matrix-card table.m th.group { font: 700 10px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0 0 4px 6px; border-left: 1px solid var(--rule); vertical-align: bottom; white-space: nowrap; }
    .matrix-card table.m th.row { text-align: left; font: 400 13px var(--display); padding: 0 14px 0 0; white-space: nowrap; height: 30px; }
    .matrix-card table.m th.row small { color: var(--muted); font: 12px var(--mono); margin-left: 6px; }
    .matrix-card table.m td { width: 44px; height: 30px; text-align: center; border-bottom: 1px solid var(--rule); border-left: 1px solid var(--rule); cursor: pointer; }
    .matrix-card table.m td.focus { background: color-mix(in srgb, var(--reef) 7%, transparent); }
    .matrix-card table.m td.picked { outline: 2px solid var(--reef); outline-offset: -2px; }
    .matrix-card table.m tr:hover td, .matrix-card table.m tr:hover th.row { background: color-mix(in srgb, var(--reef) 6%, transparent); }
    .matrix-card table.m tr.card th.row, .matrix-card table.m tr.card td { color: var(--muted); cursor: default; }
    .matrix-card .v { display: inline-block; min-width: 22px; padding: 1px 4px; border-radius: 3px; color: #fff; font-weight: 500; margin: 0 1px; }
    .matrix-card .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin: 0 1px; }
    .matrix-card .off { opacity: .3; }
    .matrix-card .ghost { opacity: .45; }
    .matrix-card .midi { background: var(--f-midi); } .matrix-card .cv { background: var(--f-cv); }
    .matrix-card .rample { background: var(--f-rample); } .matrix-card .sample { background: var(--f-sample); }
    .matrix-card .continuo { background: var(--f-continuo); }
    .matrix-hint { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; max-width: 52ch; }
    .matrix-details { margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 10px; font-size: 13px; }
    .matrix-details .who { font-weight: 700; margin-bottom: 6px; }
    .matrix-details .leg { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
    .matrix-details .leg.off { opacity: .55; }
    .matrix-details .field { color: var(--muted); font: 12px var(--mono); min-width: 4em; }
    .matrix-details .val { font: 500 13px var(--mono); min-width: 2em; text-align: center; }
    .matrix-details input { width: 4em; font: 13px var(--mono); border: none; border-bottom: 1px solid var(--rule); background: transparent; color: var(--ink); }
    .matrix-details .remove { color: var(--alarm); }
    .matrix-card table.m th.col.has-sheet { cursor: pointer; }
    .matrix-card table.m th.col.has-sheet .lab b::after { content: " ⚙"; font-weight: 400; color: var(--muted); }
    .matrix-sheet { margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 10px; font-size: 13px; }
    .matrix-sheet .who { font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .matrix-sheet table.sheet { border-collapse: collapse; font: 13px var(--mono); margin-top: 6px; }
    .matrix-sheet table.sheet th, .matrix-sheet table.sheet td { padding: 3px 10px 3px 0; border-bottom: 1px solid var(--rule); text-align: left; }
    .matrix-sheet table.sheet thead th { font: 700 10px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .matrix-sheet table.sheet tbody th { font: 400 13px var(--display); white-space: nowrap; }
    .matrix-sheet input.num { width: 3.6em; font: 13px var(--mono); border: none; border-bottom: 1px solid var(--rule); background: transparent; color: var(--ink); }
    .matrix-sheet input.num:focus { outline: none; border-bottom-color: var(--reef); }
    .matrix-sheet select { font: 13px var(--mono); color: var(--ink); background: var(--plate); border: 1px solid var(--rule); max-width: 14em; }
    svg.flows .link { cursor: pointer; }

    /* The harmony matrix: sources down, Odonus's two inputs across, a dot per route. */
    .harmony-panel { background: var(--plate); border: 1px solid var(--rule); padding: 16px 18px; margin-bottom: 24px; overflow-x: auto; }
    .router { margin: 0; }
    .router .matrix { border-collapse: collapse; font: 13px var(--mono); }
    .router .matrix th, .router .matrix td { padding: 6px 14px 6px 0; border-bottom: 1px solid var(--rule); text-align: left; }
    .router .matrix thead th { font: 700 11px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom-color: var(--ink); }
    .router .matrix th.src { font-weight: 400; white-space: nowrap; }
    .router .matrix tr.live th.src { color: var(--reef); font-weight: 600; }
    .router .matrix td.dot { width: 110px; }
    .router .matrix td.dot button { width: 16px; height: 16px; padding: 0; border-radius: 50%; border: 1.5px solid var(--faint); background: transparent; cursor: pointer; }
    .router .matrix td.dot button:hover { border-color: var(--reef); }
    .router .matrix td.dot button.on { background: var(--reef); border-color: var(--reef); }
    .router .matrix td.dot.none::before { content: "–"; color: var(--rule); }
    .router .matrix input { font: 13px var(--mono); color: var(--ink); background: transparent; border: none; border-bottom: 1px solid var(--rule); width: 9em; margin-left: 6px; padding: 1px 2px; }
    .router .matrix input.root { width: 3em; }
    .router .matrix input.wide { width: 16em; }
    .router .matrix input:focus { outline: none; border-bottom-color: var(--reef); }
    .router-problem { color: var(--alarm); font-size: 12.5px; margin: 8px 0 0; }
    .routing .notes-head { margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
    /* The signal-flow chart (Triggerfish.Flow.View). */
    :root { --s-notes: #7f9098; --s-socket: #7c5cc4; --s-midi: #13807b; --s-osc: #c08a12; --s-cv: #a8327a; --s-audio: #2f6fae; --s-samples: #8a5a2b; --s-http: #9a8fb0; --kraken: #8a3a50; --kraken-deep: #5e2234; --kraken-pupil: #2a0f18; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s-notes: #9fb0b8; --s-socket: #ab93f0; --s-midi: #4cc5bd; --s-osc: #eab94f; --s-cv: #e87bbd; --s-audio: #7fb8e0; --s-samples: #d2a06d; --s-http: #b9aed0; --kraken: #c26a82; --kraken-deep: #8e4258; --kraken-pupil: #10252e; } }
    :root[data-theme="dark"] { --s-notes: #9fb0b8; --s-socket: #ab93f0; --s-midi: #4cc5bd; --s-osc: #eab94f; --s-cv: #e87bbd; --s-audio: #7fb8e0; --s-samples: #d2a06d; --s-http: #b9aed0; --kraken: #c26a82; --kraken-deep: #8e4258; --kraken-pupil: #10252e; }
    .flow { margin-bottom: 24px; }
    .flow-chart { overflow-x: auto; background: var(--plate); border: 1px solid var(--rule); padding: 8px 0; }
    .flow-empty { margin: 0; padding: 28px 20px; color: var(--muted); }
    svg.flows { display: block; width: 100%; min-width: 1150px; height: auto; }
    svg.flows .colhead { font: 500 9.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; fill: var(--muted); }
    svg.flows .colrule { stroke: var(--rule); stroke-width: 1; }
    svg.flows .name { font: 600 13px var(--display); fill: var(--ink); }
    svg.flows .sub { font: 400 10px var(--mono); fill: var(--muted); }
    svg.flows .node text { paint-order: stroke; stroke: var(--plate); stroke-width: 3px; stroke-linejoin: round; }
    svg.flows .bar { fill: var(--ink); }
    svg.flows .link { fill-opacity: .45; transition: fill-opacity .2s; }
    svg.flows.hovering .link { fill-opacity: .07; }
    svg.flows.hovering .link.hot { fill-opacity: .9; }
    svg.flows .link.broken { stroke: var(--alarm); stroke-width: 1.2; stroke-dasharray: 4 3; }
    svg.flows .pick { cursor: pointer; outline: none; }
    svg.flows .hit { fill: transparent; }
    svg.flows .lamp-on { fill: var(--live); } svg.flows .lamp-off { fill: var(--alarm); }
    /* link-spike, above the flow: the beat, broadcast. One pulse per beat at
       the rig's tempo (the phase is not yet the Link clock's). */
    svg.flows .beat .arc { fill: none; stroke: #d4a82a; stroke-width: 2; stroke-linecap: round; opacity: .25; animation: broadcast var(--beat, .5s) ease-out infinite; }
    svg.flows .beat .arc.a2 { animation-delay: calc(var(--beat, .5s) * .12); }
    svg.flows .beat .arc.a3 { animation-delay: calc(var(--beat, .5s) * .24); }
    svg.flows .beatlabel { font: 400 10px var(--mono); fill: var(--muted); }
    svg.flows .beatmark { fill: #d4a82a; animation: pulse var(--beat, .5s) ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes broadcast { 0% { opacity: .9; } 70%, 100% { opacity: .18; } }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1.35); } 60%, 100% { opacity: .45; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { svg.flows .beat .arc, svg.flows .beatmark { animation: none; opacity: .8; } }
    svg.flows .link.idle { fill-opacity: .16; }
    /* Would sound only through the rig (Solo): drawn on its path, grey and dashed. */
    svg.flows .link.waiting { fill: var(--muted); fill-opacity: .12; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
    svg.flows.hovering .link.waiting.hot { fill-opacity: .3; }
    svg.flows.hovering .link.idle.hot { fill-opacity: .5; }
    svg.flows.resting .bar { opacity: .45; }
    svg.flows.resting .node text { fill-opacity: .7; }

    /* The machine bar: each machine's nameplate, its fish its play button. */
    .mbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 0 20px 10px; }
    .mitems { display: flex; flex-wrap: wrap; gap: 6px; }
    .mitem { flex: none; display: flex; align-items: center; gap: 9px; padding: 4px 12px 4px 4px; background: var(--field); color: var(--letter); }
    .mitem.closed { filter: saturate(.3); opacity: .72; }

    .mitem a.wordmark:hover { text-decoration: underline; text-underline-offset: 3px; }
    .mbar .w-odonus { font-size: 15px; } .mbar .w-vetula { font-size: 19px; } .mbar .w-balistes { font-size: 17px; }
    .mbar .w-selene { font-size: 9.5px; } .mbar .w-conspicillum { font-size: 17px; } .mbar .w-quadrat { font-size: 13px; }
    .fishplay { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; padding: 0; border: 2px solid transparent; background: var(--roundel, #fff); cursor: pointer; }

    .mitem.playing .fishplay { border-color: var(--live); box-shadow: 0 0 0 2px var(--plate); }

    .mitem .alias { display: inline-flex; align-items: center; gap: 5px; font: 400 11px var(--mono); opacity: .85; }
    .mitem .alias.edited::after { content: "●"; }
    svg.flows .pick:focus-visible .bar { fill: var(--reef); }
    .s-notes { fill: var(--s-notes); color: var(--s-notes); } .s-socket { fill: var(--s-socket); color: var(--s-socket); }
    .s-midi { fill: var(--s-midi); color: var(--s-midi); } .s-osc { fill: var(--s-osc); color: var(--s-osc); }
    .s-http { fill: var(--s-http); color: var(--s-http); } .s-cv { fill: var(--s-cv); color: var(--s-cv); }
    .s-audio { fill: var(--s-audio); color: var(--s-audio); } .s-samples { fill: var(--s-samples); color: var(--s-samples); }
    /* the Atlantis page: the rig's daemons by branch */
    .atl { max-width: 980px; padding: 8px 0 40px; }
    .atl-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
    .atl-head h2 { margin: 0; font: 700 22px var(--display); }
    .atl-phase { font: 400 11px var(--mono); color: var(--muted); }
    .atl-head .spacer { flex: 1; }
    .atl-confirm { font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
    .atl-none { color: var(--muted); max-width: 60ch; }
    .atl-branch { display: grid; grid-template-columns: 220px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
    .atl-bhead h3 { margin: 0 0 4px; font: 600 14px var(--display); }
    .atl-serves { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .atl-row { display: grid; grid-template-columns: 200px 140px 90px 1fr auto; align-items: center; gap: 10px; padding: 3px 0; }
    .atl-row .lamp { font: 500 12px var(--mono); color: var(--ink); }

    .lamp.coming i { background: #d4a82a; } .lamp.dead i { background: var(--alarm); }
    .btn.small { padding: 2px 10px; font-size: 12px; }
    @media (max-width: 720px) { .atl-branch { grid-template-columns: 1fr; } .atl-row { grid-template-columns: 1fr auto; } .atl-state, .atl-restarts { display: none; } }
    /* Bosun's lamps on the daemons */
    svg.flows .dlamp.up { fill: var(--live); } svg.flows .dlamp.coming { fill: #d4a82a; } svg.flows .dlamp.down { fill: var(--alarm); }

    svg.flows .link.control { fill: var(--muted); fill-opacity: .35; }
    svg.flows.hovering .link.control.hot { fill-opacity: .7; }
    /* every voice open: one line per channel, so each is quieter */

    .all-voices svg.flows.hovering .link.hot { fill-opacity: .8; }

    svg.flows .bubble .bn { font: 600 9px var(--mono); fill: var(--field, var(--ink)); }
    svg.flows .bubble.playing circle { fill: var(--field, var(--ink)); animation: pulse var(--beat, .5s) ease-out infinite; transform-box: fill-box; transform-origin: center; }
