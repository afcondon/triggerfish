<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlantis</title>
  <!-- The Atlantis dashboard (src/Triggerfish/Dashboard.purs). Served on the one
       origin with every machine's page, so they share the routing store, the
       mode, and the tab bus. Plan: docs/kb/plans/dashboard.md. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@800&family=Cormorant:ital,wght@1,700&family=Big+Shoulders+Stencil+Display:wght@800&family=Michroma&family=Instrument+Serif:ital@1&family=Major+Mono+Display&display=swap">
  <!-- The widget library's stylesheet: the quiet controls and the ledger the
       routing table is drawn with. A copy of
       purescript-halogen-widgets/css/halogen-widgets.css; after changing the
       library, copy it again (cp ../../../purescript-halogen-widgets/css/halogen-widgets.css public/). -->
  <link rel="stylesheet" href="halogen-widgets.css">
  <style>
    :root {
      --ground: #f1f6f6; --plate: #ffffff; --ink: #0f2530; --muted: #54707a; --faint: #a9bcc1;
      --rule: #cddbde; --reef: #0e5a73; --live: #2e9e6a; --alarm: #b3261e;
      /* Destination families: the routing ledger's marks and key. */
      --f-midi: #13807b; --f-cv: #a8327a; --f-rample: #c05a12; --f-sample: #5a55b8; --f-continuo: #8a5a2b;
      --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --ground: #0a1a21; --plate: #10252e; --ink: #e2eef0; --muted: #8fa9b1; --faint: #4f6d77;
        --rule: #22404b; --reef: #6cc3dc; --live: #4cc38a; --alarm: #f2837a;
        --f-midi: #4cc5bd; --f-cv: #e87bbd; --f-rample: #f0955a; --f-sample: #a9a4f2; --f-continuo: #d2a06d;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ground: #0a1a21; --plate: #10252e; --ink: #e2eef0; --muted: #8fa9b1; --faint: #4f6d77;
      --rule: #22404b; --reef: #6cc3dc; --live: #4cc38a; --alarm: #f2837a;
      --f-midi: #4cc5bd; --f-cv: #e87bbd; --f-rample: #f0955a; --f-sample: #a9a4f2; --f-continuo: #d2a06d;
    }
    /* The library reads --hw-*; point them at this page's tokens, which carry
       their own dark values. The :not() matches the specificity of the
       library's own dark rule, so this, coming later, wins in both themes. */
    :root:not([data-theme="-"]) {
      --hw-ink: var(--ink); --hw-ink-soft: var(--muted); --hw-faint: var(--faint);
      --hw-line: var(--rule); --hw-accent: var(--reef); --hw-danger: var(--alarm);
      --hw-surface: var(--plate); --hw-mono: var(--mono); --hw-font: var(--display);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 var(--display); }

    .top { position: sticky; top: 0; z-index: 10; background: var(--plate); border-bottom: 1px solid var(--ink); }
    .top .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 20px; }
    .top .row.status { padding-top: 0; gap: 6px 20px; }
    .brand { font-weight: 780; font-variation-settings: "wdth" 72; font-size: 22px; letter-spacing: .01em; }
    .seg { display: inline-flex; border: 1px solid var(--ink); }
    .seg button { font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; padding: 8px 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
    .seg button.on { background: var(--ink); color: var(--plate); }
    .tempo { font: 400 13px var(--mono); color: var(--muted); }
    .tempo .num { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
    .spacer { flex: 1; }

    .btn { display: inline-block; font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid var(--ink); padding: 8px 12px; cursor: pointer; text-decoration: none; }
    .btn.on { background: var(--ink); color: var(--plate); }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn.panic { border-color: var(--alarm); color: var(--alarm); }
    .btn.panic:hover { background: var(--alarm); color: #fff; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--reef); outline-offset: 2px; }

    .lamp { display: inline-flex; align-items: center; gap: 6px; font: 400 11px var(--mono); color: var(--muted); }
    .lamp i { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
    .lamp.live i { background: var(--live); }
    .note { font-size: 12.5px; color: var(--muted); }

    .body { display: grid; grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); gap: 24px; padding: 20px; align-items: start; }
    @media (max-width: 860px) { .body { grid-template-columns: 1fr; padding: 16px; } }
    .machines { display: grid; gap: 12px; }

    .card { background: var(--plate); border: 1px solid var(--rule); }
    .card.closed .nameplate { filter: saturate(.35); opacity: .8; }
    .nameplate { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; background: var(--field); color: var(--letter); text-decoration: none; }
    .roundel { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--roundel, #fff); }
    .roundel .ico { width: 30px; height: 18px; display: block; --fine: none; }
    .roundel.small { width: 24px; height: 24px; }
    .roundel.small .ico { width: 19px; height: 12px; --detail: none; }
    .wordmark { line-height: 1; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px 4px; }
    .meta { padding: 4px 14px 10px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; font: 400 12px var(--mono); padding: 5px 8px; border: 1px dashed var(--rule); }
    .chip.edited::after { content: "●"; color: var(--reef); }
    .chip.empty { color: var(--muted); }

    /* Nameplates: each machine's colour and face. */
    .m-odonus { --field: #1f3f94; --letter: #f4f7ff; }
    .m-vetula { --field: #c9982c; --letter: #2a1f08; }
    .m-balistes { --field: #35604a; --letter: #eaf3e4; }
    .m-selene { --field: #4f3f7f; --letter: #efeaff; }
    .m-conspicillum { --field: #16161a; --letter: #e6c02e; --roundel: #f2f2ee; }
    .m-quadrat { --field: #f3e7dc; --letter: #b4461b; }
    .w-odonus { font: 800 24px "Syne", var(--display); letter-spacing: -.01em; }
    .w-vetula { font: italic 700 30px "Cormorant", Georgia, serif; }
    .w-balistes { font: 800 28px "Big Shoulders Stencil Display", var(--display); letter-spacing: .06em; text-transform: uppercase; }
    .w-selene { font: 400 15px "Michroma", var(--display); letter-spacing: .2em; text-transform: uppercase; }
    .w-conspicillum { font: italic 400 27px "Instrument Serif", Georgia, serif; }
    .w-quadrat { font: 400 20px "Major Mono Display", var(--mono); letter-spacing: .04em; }

    .routing { background: var(--plate); border: 1px solid var(--rule); padding: 16px 18px; min-width: 0; }
    .sectionhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); margin-bottom: 8px; }
    .sectionhead h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    /* A machine's nameplate heads its group in the routing ledger. Space, not
       a rule, separates the groups. */
    .grouphead { display: flex; align-items: center; gap: 10px; margin: 0; padding: 18px 0 2px; color: var(--field); font-weight: 400; }
    .grouphead .roundel { background: #fff; box-shadow: 0 0 0 2px var(--field); }
    .grouphead .wordmark { font-size: 18px; }
    .grouphead .w-selene { font-size: 12px; }
    .grouphead .note { margin-left: 8px; }
    .routing .hw-quiet-key { margin-top: 14px; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

  <!-- Odonus niger: blue-black, pale-edged fins, red teeth, the lyre tail. -->

    <use href="#t-lyre" fill="#1d2c6c"/>
    <use href="#p-dorsal" fill="#26378a"/>
    <use href="#p-anal" fill="#26378a"/>

    <use href="#p-spine" fill="#1d2c6c"/>

    <use href="#p-anal" fill="#6f8aa0"/>
    <g style="display:var(--fine,inline)" fill="none" stroke="#2fa3d6" stroke-width="1.4">

      <path d="M160,58 C172,50 184,34 196,14"/><path d="M160,68 C172,76 184,92 196,112"/>
    </g>
    <use href="#p-spine" fill="#7c6c2c"/>

      <g stroke="#3b3320" stroke-width="1.4" style="display:var(--detail,inline)">

    <use href="#p-pectoral" fill="#9aa8a6"/>
    <path d="M65,54 C61,60 61,68 65,74" fill="none" stroke="#4a4526" stroke-width="1.5" style="display:var(--detail,inline)"/>
    <circle cx="56" cy="45" r="6" fill="#2d2716"/><circle cx="56" cy="45" r="2.6" fill="#d8c27a"/>
  </symbol>

  <!-- Balistes capriscus: olive-grey with darker saddles and blue dots. -->
  <symbol id="sp-balistes" viewBox="0 0 200 120">
    <use href="#t-crescent" fill="#6e755e"/>
    <use href="#p-dorsal" fill="#737a62"/>
    <use href="#p-anal" fill="#858b72"/>
    <use href="#p-spine" fill="#5d6450"/>

      <g fill="#7fa6c4" style="display:var(--fine,inline)">

      </g>
    </g>
    <use href="#p-pectoral" fill="#6e755e"/>
    <path d="M65,54 C61,60 61,68 65,74" fill="none" stroke="#4d5340" stroke-width="1.5" style="display:var(--detail,inline)"/>
    <circle cx="56" cy="45" r="6" fill="#2a2e22"/><circle cx="56" cy="45" r="2.6" fill="#c7cdb1"/>
  </symbol>

  <!-- Balistoides conspicillum, reduced: black, three white spots, a yellow mouth. -->
  <symbol id="sp-conspicillum" viewBox="0 0 200 120">
    <use href="#t-round" fill="#17171b"/>
    <use href="#p-dorsal" fill="#1d1d22"/>
    <use href="#p-anal" fill="#1d1d22"/>
    <use href="#p-spine" fill="#17171b"/>
    <use href="#p-body" fill="#17171b"/>
    <g clip-path="url(#c-body)" fill="#f2f2ee">
      <circle cx="74" cy="94" r="11"/><circle cx="102" cy="97" r="12"/><circle cx="130" cy="86" r="11"/>

    <path d="M10,59 C15,56 21,59 22,64 C21,69 15,72 10,69 Z" fill="#e6c02e"/>

  </symbol>

  <!-- Quadrat: a boxfish (Ostracion). A near-square body whose shell is a grid of plates. -->

        <circle cx="80" cy="60" r="3"/><circle cx="108" cy="60" r="3"/><circle cx="136" cy="60" r="3"/>
        <circle cx="52" cy="88" r="3"/><circle cx="80" cy="88" r="3"/><circle cx="108" cy="88" r="3"/><circle cx="136" cy="88" r="3"/>
      </g>
    </g>
    <path d="M84,64 C92,58 100,62 98,70 C92,72 87,70 84,64 Z" fill="#8f3a17"/>
    <ellipse cx="33" cy="70" rx="7" ry="5.5" fill="#8f3a17"/>
    <circle cx="58" cy="40" r="8" fill="#2a1409"/><circle cx="58" cy="40" r="3.4" fill="#f3d3bd"/>
  </symbol>

  <!-- Sufflamen bridled: brown, a pale bridle line from the mouth, retired. -->

    <use href="#p-anal" fill="#6f5036"/>

    <circle cx="56" cy="45" r="6" fill="#2a1d12"/><circle cx="56" cy="45" r="2.6" fill="#e0c79a"/>
  </symbol>

  <!-- Selene vomer, the lookdown: another family. Steep forehead, silver, long fin filaments. -->
  <symbol id="sp-selene" viewBox="0 0 200 120">
    <path d="M160,58 L192,34 L178,63 L192,92 L160,68 Z" fill="#aab3bf"/>
    <g fill="none" stroke="#8d7fb4" stroke-width="1.6" stroke-linecap="round" style="display:var(--fine,inline)">

    <g clip-path="url(#c-moon)" style="display:var(--detail,inline)">

    </g>
    <path d="M80,72 C88,66 96,68 96,74 C90,78 84,78 80,72 Z" fill="#b8b0d4"/>
    <circle cx="50" cy="70" r="5.5" fill="#3a3550"/><circle cx="50" cy="70" r="2.3" fill="#e6e2f4"/>
  </symbol>

  <!-- Bubbles, for a machine that is playing. -->
  <symbol id="bubbles" viewBox="0 0 200 120">
    <g class="bubbles"><circle cx="10" cy="56" r="5"/><circle cx="4" cy="56" r="3.5"/><circle cx="12" cy="56" r="2.5"/></g>
  </symbol>

  <filter id="f-caustic" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.024" numOctaves="2" seed="7" result="n"/>
    <feComponentTransfer in="n" result="bands">
      <feFuncR type="table" tableValues="0 0 1 0 0 1 0 0"/>
      <feFuncG type="table" tableValues="0 0 1 0 0 1 0 0"/>
      <feFuncB type="table" tableValues="0 0 1 0 0 1 0 0"/>
      <feFuncA type="table" tableValues="0 0 .9 0 0 .9 0 0"/>
    </feComponentTransfer>
    <feFlood flood-color="#9fd0dd" result="tint"/>
    <feComposite in="tint" in2="bands" operator="in"/>
  </filter>
</svg>
  <!-- Per-load cache-bust, as in index.html: static-httpd sends no Cache-Control. -->
  <script>document.write('<script src="dashboard.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
