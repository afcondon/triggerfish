<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odonus</title>
  <!-- Glyph substrate (docs/DESIGN-scene-modal.md): identity chips render
       FontAwesome solid icons, tinted per-machine via CSS color. CDN for now;
       vendor locally before relying on this rig offline. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- The widget library's stylesheet (a copy of
       purescript-halogen-widgets/css/halogen-widgets.css): the quiet controls.
       data-theme="light" on <html> keeps the
       library light, since this page is. -->
  <link rel="stylesheet" href="halogen-widgets.css">
  <style>
    html, body { margin: 0; background: #fafafa; }

    /* The shared shell bar's height, which the machine's panel sits below. */
    :root { --tf-bar: 44px; }
  </style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- Dev cache-bust: static-httpd sends no Cache-Control, so a normal (even
       "forced") reload kept serving a stale bundle after each rebuild. Appending
       a per-load version query forces the browser to fetch the current bundle
       every time. Written at parse time (end of body), so mount timing is
       unchanged. -->
  <script>document.write('<script src="odonus.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
